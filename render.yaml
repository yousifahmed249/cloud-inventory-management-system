services:
  - type: web
    name: cloud-inventory-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-inventory-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://yousifahmed249.github.io

databases:
  - name: cloud-inventory-db
    databaseName: inventory_db
    user: inventory_user
    plan: free
