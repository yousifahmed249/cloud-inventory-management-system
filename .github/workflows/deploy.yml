name: Deploy Inventory App

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate app syntax
        run: |
          node --check server.js
          node --check scripts/init-postgres.js

      - name: Run tests
        run: npm test --if-present