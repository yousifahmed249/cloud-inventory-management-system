name: Deploy Inventory App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate app syntax
        run: node --check server.js && node --check scripts/init-postgres.js

      - name: Initialize PostgreSQL schema
        run: npm run db:init
        if: ${{ secrets.DATABASE_URL != '' }}

      - name: Build Docker image
        run: docker build -t inventory-app .

      - name: Deploy via Docker Compose
        run: |
          docker compose up -d --build
        if: ${{ secrets.DATABASE_URL != '' }}
